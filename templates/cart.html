<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHPOINT - Shopping Cart</title>
    
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='brand/favicons/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/favicons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/favicons/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='brand/favicons/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='brand/favicons/site.webmanifest') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script src="{{ url_for('static', filename='scripts/carrinho.js') }}" defer></script>
    <script src="{{ url_for('static', filename='scripts/cep-validator.js') }}" defer></script>
    
</head>
<body>
<header class="product-header white-header">
        <div class="product-header-container">
            <img src="{{ url_for('static', filename='brand/techpoint-preto.svg') }}" alt="Logo Techpoint" class="product-header-logo">
            <nav class="product-header-nav">
                <a href="{{ url_for('shop.show_products_page') }}" class="product-header-link">Ofertas</a>
                <a href="{{ url_for('shop.show_cart_page') }}" class="cart-icon-product">
                    <span class="material-icons">shopping_cart</span>
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        
        
        <div class="back-to-products">
        </div>

        <div id="cart-items-container">
            </div>

        <aside class="order-summary">
            <h3>Resumo do Pedido</h3>
            
            <div class="summary-line">
                <span>Subtotal</span>
                <span id="summary-subtotal">R$ 0,00</span>
            </div>
            
            <div class="shipping-section" style="margin: 16px 0; padding: 16px; background: #f8f9fa; border-radius: 8px;">
                <label for="cep-input-cart" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Calcular Frete</label>
                <input type="text" id="cep-input-cart" placeholder="00000-000" maxlength="9" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
                <div id="cep-feedback-cart" style="margin-top: 8px; font-size: 12px; min-height: 16px;"></div>
                <div id="shipping-options-cart" style="margin-top: 12px;"></div>
            </div>
            
            <div class="summary-line" id="shipping-line" style="display: none;">
                <span>Frete</span>
                <span id="shipping-value">Grátis</span>
            </div>
            <div class="summary-line total">
                <span>Total</span>
                <span id="summary-total">R$ 0,00</span>
            </div>

            <form action="/create-checkout-session" method="POST">
                <button type="submit" id="checkout-button">Finalizar Compra</button> 
            </form>
            
            <button id="clear-cart-button">Esvaziar Carrinho</button>
        </aside>
    </main>

    <template id="empty-cart-template">
        <div class="empty-cart">
            <h3>Seu carrinho está vazio.</h3>
            <p>Adicione produtos da loja para vê-los aqui.</p>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar validação de CEP no carrinho
            const cepInput = document.getElementById('cep-input-cart');
            const cepFeedback = document.getElementById('cep-feedback-cart');
            const shippingContainer = document.getElementById('shipping-options-cart');
            const shippingLine = document.getElementById('shipping-line');
            const shippingValue = document.getElementById('shipping-value');
            const summaryTotal = document.getElementById('summary-total');
            const summarySubtotal = document.getElementById('summary-subtotal');

            let selectedShipping = null;

            if (cepInput && window.CEPValidator) {
                window.CEPValidator.init(cepInput, {
                    onValid: function(cep) {
                        cepFeedback.textContent = '✓ CEP válido';
                        cepFeedback.style.color = '#28a745';
                    },
                    onInvalid: function(cep) {
                        cepFeedback.textContent = '✗ CEP inválido';
                        cepFeedback.style.color = '#dc3545';
                    },
                    onFetch: function(data) {
                        cepFeedback.textContent = `✓ ${data.localidade}/${data.uf}`;
                        cepFeedback.style.color = '#28a745';
                    },
                    showShipping: true,
                    shippingContainer: shippingContainer
                });

                // Listener para seleção de frete
                if (shippingContainer) {
                    shippingContainer.addEventListener('shippingSelected', function(e) {
                        selectedShipping = e.detail;
                        
                        // Atualizar linha de frete
                        if (selectedShipping.free) {
                            shippingValue.textContent = 'Grátis';
                        } else {
                            shippingValue.textContent = 'R$ ' + selectedShipping.price.toFixed(2).replace('.', ',');
                        }
                        shippingLine.style.display = 'flex';
                        
                        // Atualizar total
                        updateTotal();
                    });
                }
            }

            function updateTotal() {
                const subtotalText = summarySubtotal.textContent.replace(/[^\d,]/g, '').replace(',', '.');
                const subtotal = parseFloat(subtotalText) || 0;
                const shipping = selectedShipping && !selectedShipping.free ? selectedShipping.price : 0;
                const total = subtotal + shipping;
                
                summaryTotal.textContent = total.toLocaleString('pt-BR', {
                    style: 'currency',
                    currency: 'BRL'
                });
            }

            // Observar mudanças no subtotal
            const observer = new MutationObserver(updateTotal);
            if (summarySubtotal) {
                observer.observe(summarySubtotal, { childList: true, characterData: true });
            }
        });
    </script>

</body>
</html>
