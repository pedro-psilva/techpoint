<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHPOINT - Shopping Cart</title>
    
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='brand/favicons/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='brand/favicons/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='brand/favicons/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='brand/favicons/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='brand/favicons/site.webmanifest') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script src="{{ url_for('static', filename='scripts/carrinho.js') }}" defer></script>
    
</head>
<body>
<header class="product-header white-header">
        <div class="product-header-container">
            <img src="{{ url_for('static', filename='brand/techpoint-preto.svg') }}" alt="Logo Techpoint" class="product-header-logo">
            <nav class="product-header-nav">
                <a href="{{ url_for('shop.show_products_page') }}" class="product-header-link">Produtos</a>
                <a href="{{ url_for('shop.show_cart_page') }}" class="cart-icon-product">
                    <span class="material-icons">shopping_cart</span>
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        
        
        <div class="back-to-products">
        </div>

        <div id="cart-items-container">
            </div>

        <aside class="order-summary">
            <h3>Resumo do Pedido</h3>
            
            <div class="summary-line">
                <span>Subtotal</span>
                <span id="summary-subtotal">R$ 0,00</span>
            </div>
            <div class="summary-line">
                <span>Frete</span>
                <span>Grátis</span>
            </div>
            <div class="summary-line total">
                <span>Total</span>
                <span id="summary-total">R$ 0,00</span>
            </div>

            <form action="/create-checkout-session" method="POST">
                <button type="submit" id="checkout-button">Finalizar Compra</button> 
            </form>
            
            <button id="clear-cart-button">Esvaziar Carrinho</button>
        </aside>
    </main>

    <template id="empty-cart-template">
        <div class="empty-cart">
            <h3>Seu carrinho está vazio.</h3>
            <p>Adicione produtos da loja para vê-los aqui.</p>
        </div>
    </template>

</body>
</html>
